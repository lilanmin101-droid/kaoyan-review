  /words/{id}/audio:
    get:
      tags:
        - words
      summary: 单词发音 mp3（有道 dictvoice，本地缓存）
      description: |
        返回 `audio/mpeg`，可直接放进 `<audio src>`。**不需要登录**（和题目图片一样；带 `?access_token=` 也行，会被忽略）。
        第一次请求时后端从有道 dictvoice 取一次（`type=2` 美音 / `type=1` 英音）并存盘（`AUDIO_DIR`，默认 `/workspace/kaoyan/data/audio/<accent>/<word>.mp3`），之后只读本地文件、不再联网；
        响应头 `X-Audio-Cache: hit|miss`，`Cache-Control: public, max-age=31536000, immutable`。
        上游失败（超时、非音频、HTTP 错误）返回 **502 JSON**（`fallback: speech_synthesis`），前端改用浏览器 `speechSynthesis` 朗读。
        Word 对象里的 `audio_url_us` / `audio_url_uk` 就是这个地址。可以用 `npm run audio:prefetch -- --limit N` 提前缓存。
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: accent
          in: query
          schema:
            type: string
            enum:
              - us
              - uk
            default: us
      responses:
        '200':
          description: mp3 音频
          headers:
            X-Audio-Cache:
              schema:
                type: string
                enum:
                  - hit
                  - miss
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '400':
          description: accent 不是 us / uk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 单词不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: 有道发音取不到（前端改用 speechSynthesis）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioError'
              example:
                statusCode: 502
                error: audio_upstream_failed
                message: 有道发音请求失败：超时
                word_id: 1
                word: abandon
                accent: us
                fallback: speech_synthesis
      operationId: getWordsByIdAudio
