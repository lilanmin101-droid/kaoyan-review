    get:
      tags:
        - agent
      summary: 定时任务列表（夜间复盘 / 周报 / 阶段检查 / 中午提醒）
      description: 每小时检查一次，按每个用户自己的时区在当地时间触发（23:00 复盘、周日 21:30 周报、04:10 阶段检查、12:30 中午提醒——只发给 coach_frequency=more）；coach_frequency / quiet_hours 的效果见 /me/settings；设了 JOB_*_CRON 时按该 cron。手动触发可加 `?respect_backoff=1` 模拟少打扰。`mode` = ai（配了 DeepSeek Key）或 mock（规则版）。`JOBS_ENABLED=0` 时不自动跑，但可以手动触发。
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                enabled: true
                timezone: Asia/Shanghai
                mode: mock
                jobs:
                  - name: nightly
                    cron: 0 0 23 * * *
                    description: 每晚 23:00 当日复盘 + 生成明日任务
                    next_run_at: '2026-11-01T23:00:00.000+08:00'
                  - name: weekly
                    cron: 0 30 21 * * 0
                    description: 每周日 21:30 周报 + 下周一计划
                    next_run_at: '2026-11-01T21:30:00.000+08:00'
                  - name: phase_check
                    cron: 0 10 0 * * *
                    description: 每天 04:10 按距考试天数检查阶段切换（04:00 学习日换天之后）
                    next_run_at: '2026-11-02T04:10:00.000+08:00'
                  - name: midday
                    cron: 0 30 * * * *
                    description: 每天 12:30（用户时区）中午进度提醒，只发给 coach_frequency=more 的用户
                    next_run_at: '2026-11-02T12:30:00.000+08:00'
      operationId: getAgentJobs
  /agent/jobs/run:
    post:
      tags:
        - agent
      summary: 【开发 / 测试】强制跑一次定时任务，不需要 API Key（看「先问我」的建议用）
      description: |
        只在 NODE_ENV≠production 或 DEV_TOOLS=1 时开放，否则 404。给当前登录用户跑一次 job，`force`（默认 true）：
        走规则版（不调模型），不看少打扰 / 提醒频率 / 「今天已跑过」，消息立刻送达（不按免打扰排队）。
        coach_frequency=ask 时生成一条新的 kind=proposal 待确认建议：按数据（错题本 → 重做 N 道错题；最弱知识点 → 练 3 道），都没有就是演示改动「做 5 道基础题热身」（midday 改今天，nightly / weekly 改明天）。去重窗口 = 今天起 7 天：窗口内已排 / 已确认 / 待确认的同一改动（同类型 + 同目标，跨天也算）不再提，热身只提一次；force:true 的结果带 forced=true，summary 和这次的动作 summary 结尾加「（测试触发）」，reason 写中性说明（不提提醒频率）；没有新的就不建消息，返回 proposal=null + proposal_skipped（原因）+ proposal_skipped_reason：dismissed「没有新的建议：这条你已经忽略过了，不再提」/ pending「…同样的建议还在等你确认，不重复提」/ planned「…想做的改动计划里已经有了，不重复提」/ mixed「…1 条你已经忽略过了，1 条计划里已经有了，都不再提」/ nothing「…计划里该有的都有了，这次不打扰你」（什么改动都没想出来）。测试触发的中午提醒按用户当地时间开头（夜深了 / 早上好 / 中午了 / 下午好 / 晚上好），不按任务名说「中午」。
        其它频率下直接执行改动（同 /agent/jobs/{job}/run）。force=false = 普通手动触发。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                job:
                  type: string
                  enum: [nightly, weekly, midday, phase_check]
                  default: nightly
                force:
                  type: boolean
                  default: true
            example:
              job: nightly
              force: true
      responses:
        '200':
          description: 同 /agent/jobs/{job}/run，另加 dev=true
          content:
            application/json:
              example:
                job: midday
                skipped: false
                mode: mock
                dev: true
                proposal:
                  message_id: b4661ecd-4ef7-49bb-ab43-c2ae90cff2a6
                  items:
                    - tool: updateDailyPlan
                      job: midday
                      summary: 在 11-01 的计划里加了「重做 3 道错题」；更新了 11-01 计划的说明
                      input:
                        date: '2026-11-01'
                        why_changed: 错题本里还有 3 道没掌握，今天先重做 3 道。
                        add_tasks:
                          - kind: redo_wrong
                            title: 重做 3 道错题
                            estimated_minutes: 24
                            payload:
                              question_ids: [math1-2024-01, math1-2024-02, math1-2024-03]
        '400':
          description: job 不对（code=invalid_job）
        '404':
          description: 生产环境未开启 DEV_TOOLS
      operationId: postAgentJobsRunDev
  /agent/jobs/{job}/run:
    post:
      tags:
        - agent
      summary: 立刻为当前用户跑一次定时任务（调试 / 「现在复盘」按钮）
      description: 产生的改动和定时跑的一样记 AgentAction（trigger = nightly / weekly / phase_check / midday；ask 模式下确认后执行的是 confirm），可撤回。同一天同一任务重复跑会覆盖当天那条 tip（upsert），不会重复堆积。
      parameters:
        - name: job
          in: path
          required: true
          schema:
            type: string
            enum:
              - nightly
              - weekly
              - phase_check
              - midday
      responses:
        '201':
          description: OK。`skipped`=true 时 `reason` 说明原因（少打扰 / less 未满 3 天 / midday 不是 more）。coach_frequency=ask 时改动不执行，返回 `proposal` {message_id, items}
          content:
            application/json:
              example:
                job: nightly
                skipped: false
                mode: mock
                summary: 写了 11-01 的今日复盘
                reply: 今天还没有作答记录。明天从一组基础题开始。
                actions:
                  - id: 7b256961-55d1-496e-8716-f6a893e9be6e
                    command_id: null
                    trigger: nightly
                    tool: writeDailyTip
                    summary: 写了 11-01 的今日复盘
                    reason: 每晚 23:00 自动复盘
                    target:
                      kind: daily_tip
                      id: 3d93c8a7-014d-446b-b601-b6cdcba7ad82
                    before: null
                    after:
                      kind: review
                      text: 今天还没有作答记录。明天从一组基础题开始。
                      source: mock
                    undoable: true
                    undone_at: null
                    created_at: '2026-11-01T12:39:07.917Z'
        '400':
          $ref: '#/components/responses/Error'
      operationId: postAgentJobsByJobRun
