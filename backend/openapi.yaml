      description: |
        事件类型：
        - `step`：一句中文，说明它正在做什么（前端用朱红小字逐行显示）
        - `action`：它刚做的一次改动（完整 AgentAction，带 summary / target / reason，可撤回）
        - `done`：结束，`summary` 是本次所有改动的一句话汇总
        - `error`：出错
        配了 `DEEPSEEK_API_KEY` 时由 Mastra Agent（deepseek-chat）真实调用工具：读档案/错题/作答/搜题，写计划/复习卡/提醒/阶段/每日一句，每次写都记一条可撤回的 AgentAction。
        没配 Key 时走规则版（`done.mock = true`）：按错题情况往今天计划里加一条任务并写操作日志，撤回可用；不调模型。
        幂等：去重键 = 用户 + 意图 + 目标日期 + 任务（类型 + 目标/数量），不看原句。60 秒内同键已执行过、或今天计划里已有同样任务时跳过，
        发一条 step「今天（MM-DD）的计划里已经有「…」，没有重复添加」，`done.deduped = true`。同一用户的命令串行执行。
        **问题不执行、不去重**：「那今天的单词还背吗」「今天还要做什么」「错题还剩几道」「离考试还有几天」「我这周进度怎么样」这类问题（不是命令）按当时的真实数据直接回答
        （做不做、做多少、一句建议；结合这个学习日前面说过的时间预算，如「今天只有一小时」），什么都不改：`action_count = 0`，`done.question_kind` = words / todo / wrong_left / exam_days / week，`mock = false`。
        **同一句话（规范化后）只在同一学习日、按有效的「现在」（`X-Debug-Now` 也算）60 秒内重发、且中间数据没变 = 重复**；换了学习日（如 00:30 和 04:30）一律重新执行。（错题本、作答、最近几天的计划任务、提醒、阶段、撤回都和上次执行完时一样，再执行结果也一样），哪怕带「加/再/多」也不再执行；中间数据变了（比如又做错了题）就重新执行：step「刚刚说过同样的话，刚才已从 3 道加到 5 道，今天（MM-DD）的计划里已经有「…」，这次没有重复执行。还要再加的话，回「确认再加 N 道」」，
        `done.deduped = true`、`done.duplicate_of` = 第一次的 command_id（同一 question_id 才算同一句；第一次的改动被撤回后不算重复）。
        **数量语义**：句子里有「加/再/多/补/追加」= 在今天已有的同类任务上**叠加**（「重做 3 道」后「加两道」→ 5，step「今天（MM-DD）的「重做错题」已从 3 道加到 5 道」）；
        只给数量（「今天重做 5 道」）= **设定**为这个数（3 → 5，不是 8）；已经是这个数 → step「今天（MM-DD）的计划里已经有…」，`deduped = true`。
        没有同类任务就新建一条。错题不够时 step 说明「错题本里该重做的只有 M 道，先排这 M 道」。每次改数量都记一条 AgentAction（before = 原任务，after 带 quantity_from / quantity_to），撤回恢复原数量。
        凌晨 0–4 点（用户时区）说「今天」时多一条 step「现在是 HH:MM（时区），按今天（MM-DD）算；如果你说的是昨晚，回我一句」。
        数量照用户说的（一道=1、两道=2、数字），没说才默认 3。`done.date` = 改动的计划日期（默认用户时区的今天，用户明说「明天/周六」才改别天）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - text
              properties:
                text:
                  type: string
                  example: 这周把极限练透
                client_id:
                  type: string
                question_id:
                  type: string
                  description: 在某道题上说话时带上（如「这题我会，是手滑」→ 记为 careless）
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 文本流；每条 data 是一个 JSON，结构见 x-sse-event-schema
              example: |
                event: step
                data: {"type":"step","command_id":"5d6e7f80-1a2b-4c3d-8e9f-0a1b2c3d4e5f","text":"收到：「这周把极限练透」"}

                event: step
                data: {"type":"step","command_id":"5d6e7f80-1a2b-4c3d-8e9f-0a1b2c3d4e5f","text":"正在翻你的错题本","tool":"getWrongQuestions"}

                event: step
                data: {"type":"step","command_id":"5d6e7f80-1a2b-4c3d-8e9f-0a1b2c3d4e5f","text":"找到 3 道该重做的错题，排进 2026-11-02 的计划","tool":"updateDailyPlan"}

                event: action
                data: {"type":"action","command_id":"5d6e7f80-1a2b-4c3d-8e9f-0a1b2c3d4e5f","action":{"id":"a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d","tool":"updateDailyPlan","summary":"把 3 道极限错题排进了明天","reason":"你说「这周把极限练透」，这 3 道错题到了复习时间，先重做再刷新题。","target":{"kind":"plan_task","id":"8b9c0d1e-2f3a-4b5c-6d7e-8f9a0b1c2d3e"},"undoable":true,"undone_at":null,"created_at":"2026-11-01T11:55:00Z"}}

                event: done
                data: {"type":"done","command_id":"5d6e7f80-1a2b-4c3d-8e9f-0a1b2c3d4e5f","summary":"把 3 道极限错题排进了明天","mock":true,"reply":null,"action_count":1,"deduped":false,"date":"2026-11-02"}
              x-sse-event-schema:
                $ref: '#/components/schemas/AgentCommandEvent'
      operationId: postAgentCommands
  /agent/actions:
    get:
      tags:
        - agent
      summary: 改动记录（首页 /「教练改过的」那一列）：一次命令 / 一次确认的建议 / 一次定时任务 = 一条
      description: |
        默认按 `group_id` 合并：同一次命令（group_id = command_id）、同一次确认建议（trigger=confirm）、同一次定时任务产生的动作只返回一行（AgentActionEntry）。
        这一行的 id / tool / target / before / after / reason 取主动作（改任务优先，附带的「更新了计划的说明」不单独显示），`summary` 是主动作摘要（多处改动用「；」连接），
        `action_count` = 组内动作数，`actions` = 组内全部动作（按发生顺序，前端可折叠显示明细）。`undoable` = 组里还有能撤的；`undone_at` 整组都撤了才有值。
        老数据（没有 group_id）每条自成一行，`action_count` = 1。`?flat=1` 返回旧格式（一条动作一行，AgentAction）。
      parameters:
        - name: limit
          in: query
          description: 最多返回多少行（组）
          schema:
            type: integer
            default: 30
        - name: include_undone
          in: query
          schema:
            type: boolean
            default: true
        - name: flat
          in: query
          description: 1 = 旧格式，不合并
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentActionEntry'
              example:
                items:
                  - id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                    command_id: 5d6e7f80-1a2b-4c3d-8e9f-0a1b2c3d4e5f
