  /agent/actions/{id}/undo:
    post:
      tags:
        - agent
      summary: 撤回一条改动（整组）
      description: |
        传列表里那一行的 id（或组里任意一条动作的 id）：整组动作在同一个事务里按发生顺序倒序撤回，任何一条失败整组都不撤。
        按 before 恢复；before 为 null 表示那次是新增，撤回就是拿掉新增的内容。已撤回再撤回（包括组里另一条）返回 409。
        返回撤回后的那一行（AgentActionEntry）+ `undone_action_ids`。
      parameters:
        - name: id
