  /agent/messages/{id}/confirm:
    post:
      tags:
        - agent
      summary: 确认教练的待确认改动（coach_frequency=ask）
      description: 按原样执行 proposal.items（trigger = confirm，记 AgentAction，可撤回）。响应带 message {id, status, headline, details}（status = confirmed / dismissed）：确认后标题是过去时「已在 11-02 的计划里加了「…」」（部分确认「已改 k 处：…；没改 m 处：…」，忽略「已忽略，计划没改」），GET /agent/messages 和 /plans/today 的 tips.proposal 同样按状态显示（老数据读时也套用）。定时任务提建议前会去重（窗口 = 今天起 7 天）：窗口内计划里已有的、今天提过的、最近待确认 / 已确认的同一改动（同类型 + 同目标，或重做题目已被覆盖）不再提，不分哪天（明天排过的今天也不提），演示热身只提一次；都去掉了就不建新消息，任务结果 proposal=null 并带 proposal_skipped（原因）。body.items 可选，只执行这些下标；不给 = 全部。每次定时任务运行都会新建一条 proposal 消息（不合并、不改已确认/已忽略的那条），每条只能确认或忽略一次。建议文案是「想在 11-02 的计划里加「…」」（还没执行），确认后 actions[].summary 才是「加了…」。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: integer
            example:
              items: [0]
      responses:
        '201':
          description: OK
          content:
            application/json:
              example:
                proposal:
                  status: confirmed
                  decided_at: '2026-11-02T08:01:00-08:00'
                  applied_items: [0]
                  action_ids: [93e1b2fd-0c94-4953-9f16-e911bbdc95aa]
                  items: []
                actions:
                  - id: 93e1b2fd-0c94-4953-9f16-e911bbdc95aa
                    trigger: confirm
                    tool: updateDailyPlan
                    summary: 在 11-02 的计划里加了「重做 1 道到期错题」
                    undoable: true
        '400':
          description: items 下标不对
        '404':
          description: 消息不存在或不是 proposal（code=proposal_not_found，形状见 Error）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            - code=already_decided：已经确认或忽略过了（message「这条建议已经处理过了」，另带 proposal）。
            - code=proposal_expired：建议的目标日已经过了（见 status=expired），什么都没改；message 是给学生看的中文（前端直接 toast），另带 target_date、proposal（status=expired）。
            detail 仅供调试，不要展示。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                already_decided:
                  value:
                    statusCode: 409
                    error: Conflict
                    message: 这条建议已经处理过了
                    field: null
                    code: already_decided
                    detail: 之前已经确认了，不会重复执行
                proposal_expired:
                  value:
                    statusCode: 409
                    error: Conflict
                    message: 这条建议已经过期了，计划没动；还需要的话直接跟教练说一声
                    field: null
                    code: proposal_expired
                    detail: 建议的日子已经过去了，不能再确认
                    target_date: '2026-11-05'
                    proposal:
                      status: expired
                      items:
                        - tool: updateDailyPlan
                          summary: 想在11-05（周四）的计划里加「做 5 道基础题热身」
      operationId: postAgentMessageConfirm
