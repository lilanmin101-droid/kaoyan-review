  /exams/{id}/progress:
    put:
      tags:
        - exams
      summary: 保存进度（幂等；也用作心跳、暂停、继续）
      description: |
        - 每答一题、切题、暂停/继续时调用；作答中建议至少每 60 秒发一次（可以不带 answers，当心跳）。
        - **幂等**：同一个 `idempotency_key` 重发，返回第一次的结果（`duplicate: true`），不会重复生效。
        - **乱序**：`client_seq` 是客户端单调递增序号；比服务端已收到的小的请求视为旧请求（`stale: true`），不覆盖答案。每道题保留 seq 最大的答案。
        - **计时在服务端**：`state: paused` 暂停计时，`state: running` 继续；两次保存之间最多计 120 秒，断网或关页面不会一直扣时间。返回 `remaining_seconds`。
      parameters:
        - $ref: '#/components/parameters/ExamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamProgressRequest'
            examples:
              answer:
                value:
                  idempotency_key: 7d0c5a0e-1f2a-4b3c-8d4e-5f6a7b8c9d0e
                  client_seq: 12
                  answers:
                    - question_id: math1-2024-02
                      answer:
                        - A
                      time_spent_seconds: 210
                  current_question_id: math1-2024-03
              pause:
                value:
                  idempotency_key: 1a2b3c4d-0000-4000-8000-000000000013
                  client_seq: 13
                  state: paused
              heartbeat:
                value:
                  idempotency_key: 1a2b3c4d-0000-4000-8000-000000000014
                  client_seq: 14
      responses:
        '200':
          description: 保存后的模考状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Exam'
                  - type: object
                    properties:
                      duplicate:
                        type: boolean
                        description: 这个 idempotency_key 之前已经处理过
                      stale:
                        type: boolean
                        description: client_seq 落后，答案没覆盖
