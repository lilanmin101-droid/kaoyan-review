# 由 mock/server.js 读取；修改后重启 mock 即可
openapi: 3.1.0
info:
  title: 考研复习 App API
  version: 0.1.0
  description: |
    Tony 自用的考研复习 App 后端接口（第一版：数一 + 英一）。

    - 前缀：`/api/v1`；鉴权：`Authorization: Bearer <access_token>`（除 `/auth/*`、`/health`）
    - 可选请求头 `X-Device: pc | phone | <自定义>`，用于两端同步时区分来源设备
    - **请求头 `X-Timezone: <IANA 时区>`**（如 `America/Los_Angeles`、`Asia/Shanghai`），前端每个请求都带。
      后端用 Intl 校验，和 `users.settings.timezone` 不同就写进去（登录后的全局拦截器）。
      「今天」只在后端一个地方算：settings.timezone → X-Timezone → 环境变量 APP_TZ；前端不要自己传日期当「今天」。
      计划、命令栏、/words/today、错题到期、教练、统计的日期边界都按这个时区。也可以用 `PATCH /me/settings` 显式改。
    - **学习日：当地 04:00 换天**（`DAY_START_HOUR=4`，后端唯一的 `studyDate()` / `today()`）。凌晨 00:00–03:59 还算前一天：
      今天 / 明天、排计划的目标日、夜间复盘和建议、单词每日快照和 /words/today、打卡和连续天数、错题到期、统计的按天分桶、
      教练各任务（阶段检查改在 04:10）、days_to_exam 都按学习日。作答等原始时间戳（answered_at 等）不变，只是按学习日分组。
      例：上海 11-02 00:04 跑夜间复盘 → 学习日 11-01，建议排到 11-02，文案「明天（11-02）」。
      **前端不算日界**：学生能看到的日期旁边都带一个相对叫法字段（`relative_day` / `due_relative_day`：今天 / 明天 / 昨天 / 后天 / 前天，更远为 null），直接显示；
      今天的学习日在 `GET /me/settings` 的 `today` / `effective.study_date` 和 `GET /plans/today` 的 `study_date`。
      **「这周 / 本周 / 上周」一律写整周范围（周一–周日）**：「这周（11-02–11-08）」，不写成「这周（11-02）」。
      文案里的日子一律「相对叫法 + 日期」：±1 天（及后天/前天）「明天（11-02）」；6 天内「周三（11-04）」；更远「11-20（周五）」（日期在前、星期在括号里）。
    - **文字里的日期读时渲染**：存库的文案（建议、确认后的标题、改动记录 summary/reason、计划 why_changed、命令历史 events/result、复盘文案）
      里日期存成占位符 `{{date:2026-11-02}}`，每次读（含 SSE）都按**读者此刻的学习日**渲染成上面的叫法——同一条建议今天读是「明天（11-02）」、
      第二天读是「今天（11-02）」、8 天后读是「11-02（周一）」。`X-Debug-Now` 也生效。前端拿到的永远是渲染好的文字，不会看到占位符。
      渲染后日期两边不留空格（「在11-02（周一）的计划里」）。往后看的说法（日期后面紧跟「先…」，如复盘「明天（11-02）先重做 1 道」）存成 `{{date:2026-11-02|plan}}`：
      读的时候那天还没过 → 「明天（11-02）先重做 1 道」；已经过了 → 「11-02（周一）当天计划重做 1 道」。改动记录的 before / after 快照里的日期也一样存占位符、读时渲染。
      `/agent/*`、`/plans*` 的文字同时整理引号层级：第一层「」、第二层『』、更深的去掉引号，如「已在明天（11-02）的计划里加了『练 3 道变限积分』」。
    - **凌晨说明每个学习日只说一次**：当地 00:00–03:59 处理涉及今天 / 明天 / 昨天的命令时，回复末尾补一句「凌晨 4 点前还算 MM-DD 这一天。」；
      每个用户每个学习日只在第一次说（夜间复盘 / 午间提醒在这个时段跑时写进 details，也算说过），04:00 以后不说。
    - 开发/测试专用请求头 `X-Debug-Now: <ISO 时间>`：把这次请求的「现在」改成给定时间（测凌晨、跨天）。`NODE_ENV=production` 或 `DISABLE_DEBUG_NOW=1` 时忽略，前端不要发
    - 流式接口（`/agent/commands`、`/questions/{id}/explain`）返回 `text/event-stream`，每条消息形如
      `event: <type>\ndata: {"type":"<type>", ...}\n\n`，**按整步推送，不逐字**
    - AI 相关接口目前是桩（没有 API Key），返回结构与正式版一致，带 `mock: true`
    - 错误统一为 `{ statusCode, message, error }`
    - 题目图片：`GET /assets/{path}`，不需要登录；图片地址 = 题目的 `asset_base` + 相对路径
    - Mock 服务：`npm run mock`，端口 4010，返回本文件里的 example
servers:
  - url: http://localhost:3000/api/v1
    description: 真实后端（NestJS）
  - url: http://localhost:4010/api/v1
    description: Mock 服务
security:
  - bearer: []
tags:
  - name: auth
    description: 账号密码登录
  - name: questions
    description: 题库、分步提示、讲解
  - name: answers
    description: 作答记录（只追加）
  - name: exams
    description: 整卷模考（暂停/断网续考）
  - name: wrong-questions
    description: 错题本
  - name: words
    description: 背单词（FSRS）
  - name: plans
    description: 每日计划
  - name: checkins
    description: 打卡
  - name: sync
    description: 两端同步
  - name: events
    description: 埋点
  - name: agent
    description: 教练 Agent（命令、改动记录、撤回）
  - name: feynman
    description: 讲给它听
  - name: mastery
    description: 掌握度地图与学习档案
paths:
  /health:
    get:
      tags:
        - auth
      summary: 健康检查
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                ok: true
                db: PostgreSQL 17.11
                pgvector: false
                questions: 22
                ai: mock
      operationId: getHealth
  /auth/register:
    post:
      tags:
        - auth
      summary: 注册
      description: 时区：请求头 X-Timezone（合法 IANA，如 America/Los_Angeles）优先 → body.timezone → 默认 Asia/Shanghai，存进 users.settings.timezone，响应里带 timezone。用户名已占用 → 409 code=username_taken。
      security: []
      parameters:
        - name: X-Timezone
          in: header
          required: false
          schema:
            type: string
          example: America/Los_Angeles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: tony
              password: secret123
              display_name: Tony
              exam_date: '2027-12-25'
      responses:
        '201':
          $ref: '#/components/responses/Auth'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
      operationId: postAuthRegister
  /auth/login:
    post:
      tags:
        - auth
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: tony
              password: secret123
      responses:
        '200':
          $ref: '#/components/responses/Auth'
        '401':
          $ref: '#/components/responses/Error'
      operationId: postAuthLogin
  /auth/me:
    get:
      tags:
        - auth
      summary: 当前用户
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 6f1c2a4e-1b2c-4d5e-8f90-123456789abc
                username: tony
                display_name: Tony
                exam_date: '2027-12-25'
                settings: {}
                created_at: '2026-11-01T11:00:00Z'
      operationId: getAuthMe
  /me/settings:
    get:
      tags:
        - auth
      summary: 「我的」页设置：时区 + 目标 + 教练频率 + 免打扰
      description: |
        `settings` 原样返回 users.settings 里存的字段（扁平，字段名固定）：`timezone`、`target_school`、`target_score`、`exam_date`、`coach_frequency`、`quiet_hours`。没设过的键不出现。
        `effective` 是后端实际生效的值：`coach_frequency` 默认 normal；`quiet_hours` 默认 null；`study_date` = 今天的学习日（当地 04:00 换天，凌晨 0–4 点还是前一天；和顶层 `today` 相同），`day_start_hour` = 4，`calendar_date` / `local_time` = 当地日历日期和时间（只用于说明「现在 00:30 还算 11-01」）；`days_to_exam` 按学习日算到 exam_date（没设为 null，也驱动 /plans/today.days_to_exam）；
        `auto_reduced` = 后端因为「别管我」或连续两次复盘没打开而自动降成了少打扰（只读；PATCH coach_frequency=normal/more 会解除），`auto_reduced_every_days` 是降级后的复盘间隔。
        coach_frequency 含义（只管教练主动发的，学生自己发的指令照常立刻执行）：
        - `normal`：每晚 23:00 复盘 + 周日 21:30 周报 + 04:10 阶段检查（学习日换天之后）。
        - `less`：夜间复盘每 3 天一次（距上次送达的复盘不足 3 天就跳过），周报和阶段检查照常。
        - `more`：在 normal 基础上每天 12:30 多一条中午提醒（kind=nudge）。
        - `ask`：定时任务照常跑、照常写复盘，但改计划 / 加复习卡 / 设提醒 / 切阶段只生成一条 kind=proposal 的消息（proposal.status=pending），不执行；学生 POST /agent/messages/{id}/confirm 后才执行（可撤回），/dismiss 或不理就不执行。
        `quiet_hours`（用户时区，24 小时制，可跨零点，如 22:30–08:00）：定时任务照常在原时刻跑，但这段时间里产生的主动消息 delivered_at 排到时段结束（GET /agent/messages 和 /plans/today 到那时才出现）。
        「别管我」/连续 2 天没看导致的降频叠加在这些设置上面。
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                settings:
                  timezone: America/Los_Angeles
                  target_school: 浙江大学 计算机
                  target_score: 400
                  exam_date: '2026-12-19'
                  coach_frequency: ask
                  quiet_hours:
                    start: '22:30'
                    end: '08:00'
                timezone: America/Los_Angeles
                today: '2026-11-01'
                effective:
                  coach_frequency: ask
                  quiet_hours:
                    start: '22:30'
                    end: '08:00'
                  study_date: '2026-11-01'
                  day_start_hour: 4
                  calendar_date: '2026-11-02'
                  local_time: '00:30'
                  days_to_exam: 48
                  auto_reduced: false
                  auto_reduced_every_days: null
      operationId: getMeSettings
    patch:
      tags:
        - auth
      summary: 改设置（部分更新：传哪项改哪项，和已有的合并；传 null 清空该项）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              description: 未知字段（比如拼错的键）返回 400
              properties:
                timezone:
                  type: string
                  description: IANA 时区名，Intl 校验不过返回 400
                  example: America/Los_Angeles
                target_school:
                  type: [string, 'null']
                  minLength: 1
                  maxLength: 80
                target_score:
                  type: [integer, 'null']
                  minimum: 0
                  maximum: 500
                exam_date:
                  type: [string, 'null']
                  format: date
                  description: YYYY-MM-DD，必须是真实日期；同时写进 users.exam_date（阶段检查用）
                coach_frequency:
                  type: string
                  enum: [more, normal, less, ask]
                quiet_hours:
                  type: [object, 'null']
                  description: 免打扰时段（用户时区，可跨零点），start 不能等于 end，只允许 start/end 两个键；关掉传 null
                  additionalProperties: false
                  required: [start, end]
                  properties:
                    start:
                      type: string
                      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                      example: '22:30'
                    end:
                      type: string
                      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                      example: '08:00'
            example:
              target_school: 浙江大学 计算机
              target_score: 400
              exam_date: '2026-12-19'
              coach_frequency: ask
              quiet_hours:
                start: '22:30'
                end: '08:00'
      responses:
        '200':
          description: OK（同 GET）
        '400':
          description: |
            值不合法 / 未知字段 / 一项都没给。`message` 可以直接显示给学生（不含字段名），`field` = 出错的字段（未知字段时是那个键名，整体问题为 null），`code` 给前端判断：
            invalid_body 「没收到要保存的设置，请重试」/ empty 「没有要保存的改动」/ unknown_field 「有一项设置暂时不支持，请刷新页面后再试」/
            invalid_timezone 「时区不对，请从列表里选一个」/ invalid_target_school 「目标院校填 1–80 个字」/ invalid_target_score 「目标分填 0–500 之间的整数」/
            invalid_exam_date 「考试日期格式不对」/ invalid_coach_frequency 「教练提醒频率请从「多 / 正常 / 少 / 先问我」里选一个」/
            invalid_quiet_hours 「免打扰时间要写成 23:00 这样」/ quiet_hours_same 「免打扰的开始和结束时间不能一样」
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInputError'
              example:
                statusCode: 400
                error: Bad Request
                message: 目标分填 0–500 之间的整数
                field: target_score
                code: invalid_target_score
      operationId: patchMeSettings
  /me/stats:
    get:
      tags:
        - auth
      summary: 学习统计（「我的」页）
      description: |
        全部按用户时区算日界（settings.timezone / X-Timezone）。一天算「学了」= 当天有作答、背单词或打卡分钟 > 0。
        `streak_days` 从今天往回数；今天还没学就从昨天数（`streak_includes_today = false`），早上打开不会显示断了。
        `accuracy` = 已判对错的作答里答对的比例（待自评的主观题不算）；`questions_done` = 做过的不同题目数，`attempts` = 作答次数。
        `subjects` = 各科（知识点一级）的掌握度：已练知识点 score 的平均 + 练过 / 总知识点数；细到知识点看 `GET /mastery/tree`。
        序列：总是带 `last_7`；另外带 `last_{days}`（默认 days=30，即 `last_30`），每项一天，最后一项是今天。
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                timezone: America/Los_Angeles
                today: '2026-11-01'
                days_studied: 3
                streak_days: 3
                streak_includes_today: false
                best_streak_days: 3
                first_study_date: '2026-10-29'
                questions_done: 2
                attempts: 3
                judged_attempts: 3
                correct_attempts: 2
                accuracy: 0.667
                study_minutes: 0
                words:
                  learned: 120
                  solid: 40
                  due: 18
                wrong_questions:
                  active: 1
                  mastered: 0
                subjects:
                  - subject: 高等数学
                    path: 高等数学
                    score: 0.42
                    practiced_points: 6
                    total_points: 54
                    attempts: 9
                    accuracy: 0.556
                last_7:
                  summary:
                    days_studied: 3
                    answers: 3
                    accuracy: 0.667
                    words_reviewed: 0
                  series:
                    - date: '2026-11-01'
                      answers: 0
                      judged: 0
                      correct: 0
                      questions: 0
                      study_seconds: 0
                      words_reviewed: 0
                      new_words: 0
                      checkin_minutes: 0
                      accuracy: null
                      studied: false
                last_30:
                  summary:
                    days_studied: 3
                    answers: 3
                    accuracy: 0.667
                    words_reviewed: 0
                  series: []
        '400':
          description: days 不是 1–90 的整数
      operationId: getMeStats
  /questions:
    get:
      tags:
        - questions
      summary: 题目列表（默认不含答案）
      parameters:
        - name: exam
          in: query
          schema:
            type: string
            enum:
              - math1
              - english1
        - name: year
          in: query
          schema:
            type: integer
          example: 2024
        - name: type
          in: query
          schema:
            type: string
            enum:
              - single_choice
              - multi_choice
              - fill_blank
              - essay
              - cloze
              - reading
              - translation
              - writing
        - name: section
          in: query
          description: 数学为「选择题/填空题/解答题」；英语为 use_of_english / reading_a / reading_b / translation / writing_a / writing_b
          schema:
            type: string
          example: 选择题
        - name: kp
          in: query
          description: 知识点路径，支持前缀（章或科目）
          schema:
            type: string
          example: 高等数学/一元函数积分学
        - name: review_status
          in: query
          schema:
            type: string
            enum:
              - pending
              - suspect
              - confirmed
        - name: q
          in: query
          description: 题干关键字
          schema:
            type: string
        - name: include_answer
          in: query
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Question'
                  page:
                    type: integer
                  page_size:
                    type: integer
                  total:
                    type: integer
                  groups:
                    type: array
                    description: |
                      只有 exam=english1/english2 时返回：按文章分组（题号顺序），每组带完整文章（Passage，含 blanks / underlines）；写作等没有文章的题各自一组（passage=null）。
                      英语默认 page_size=100（一年 52 题一次拿全）。items 字段不变。
                    items:
                      type: object
                      properties:
                        passage_id:
                          type:
                            - string
                            - 'null'
                        section:
                          type: string
                          example: reading_a
                        section_name:
                          type: string
                          example: 阅读理解 A
                        passage:
                          oneOf:
                            - $ref: '#/components/schemas/Passage'
                            - type: 'null'
                        questions:
                          type: array
                          items:
                            $ref: '#/components/schemas/Question'
              example:
                page: 1
                page_size: 20
                total: 22
                items:
                  - schema_version: '0.2'
                    id: math1-2024-01
                    exam: math1
                    year: 2024
                    number: 1
                    section: 选择题
                    type: single_choice
                    score: 5
                    stem: 已知函数 $f(x)=\int_0^x \mathrm{e}^{\cos t}\,\mathrm{d}t$，$g(x)=\int_0^{\sin x}\mathrm{e}^{t^2}\,\mathrm{d}t$，则
                    images: []
                    options:
                      - key: A
                        content: $f(x)$ 为奇函数，$g(x)$ 为偶函数
                      - key: B
                        content: $f(x)$ 为偶函数，$g(x)$ 为奇函数
                      - key: C
                        content: $f(x)$ 与 $g(x)$ 均为奇函数
                      - key: D
                        content: $f(x)$ 与 $g(x)$ 均为偶函数
                    sub_questions: []
                    score_estimated: false
                    score_by_whole: false
                    knowledge_points:
                      - 高等数学/一元函数积分学/变限积分
                    kp_confidence: null
                    source:
                      repo: TsekaLuk/Kaoyan-Math1-Papers
                      files:
                        - papers/2024年数学(一)真题及参考答案.md
                    review:
                      status: pending
                      notes: []
                      checked_by: []
                    import_problems: []
                    asset_base: /api/v1/assets/
      operationId: getQuestions
  /questions/years:
    get:
      tags:
        - questions
      summary: 各年份题目数量与核对状态（年份切换器用 `ready`）
      parameters:
        - name: exam
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK。`ready` = 该年全部题目都已 confirmed
          content:
            application/json:
              example:
                items:
                  - exam: math1
                    year: 2024
                    total: 22
                    confirmed: 22
                    pending: 0
                    suspect: 0
                    max_score: 150
                    ready: true
                ready:
                  - exam: math1
