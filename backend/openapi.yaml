  /exams/{id}/self-ratings:
    post:
      tags:
        - exams
      summary: 交卷后自评解答题（幂等；同一题再评一次覆盖上一次）
      description: |
        - 只能在交卷后调（否则 409）。校验规则和 submit 的 self_ratings 一样：证明题（score_by_whole）只能整题一个值；计算题按小问 {"1": "full"}，给一个整题值等于每个小问都按这个值；客观题、不在这场的题、不存在的小问都返回 400。
        - 每次自评都按作答记录写入（错题本 / 掌握度照常更新）：自评不是 full 的题（含部分得分）进错题本（source=exam）；之后改成 full 会把它从 active 转成 mastered。
        - 英语翻译 / 作文（统筹者定）：没作答（空或只有空白）不管评了哪档都记 0 分（self_rating 改成 no_idea，per_question.unanswered = true，submitted_self_rating = 提交上来的档）；交卷时没作答的这几题直接记 0 分，不用再评。
          字数线：小作文 < 50 词、大作文 < 80 词、翻译 < 参考译文词数的 30%。低于线但评了 full（基本到位）或 approach_ok_calc_wrong（大概一半）照记，per_question 带 `self_grade_flags: ["word_count_low"]`；
          这几题的 per_question 都带 `word_count`（作答词数）、`min_words`（字数线）、`unanswered`、`self_grade_flags`（没问题是 []）；这些字段出现之前交的老成绩，读的时候按存下的作答补算（分数不重算）。从模考进错题本的这几题，`GET /wrong-questions` 每项也带 self_grade_flags / word_count / min_words / unanswered。
        - 重算 result（总分、分题型、分科、丢分知识点、结论、pending_self_rating）。全部自评完时生成教练一句话（result.coach，同时是 GET /agent/messages 里 kind=exam_review 的消息）；之后再改自评会更新这句话。
        - 同一个 idempotency_key 重发返回第一次的结果（duplicate: true）。
        - **只评一部分小问会和之前评过的合并**（先评 (1)、之后再评 (2)，两个都在）；没给的小问保持原样。
        - **还没评完（pending_self_rating 不空）时 `result.coach` 一定是 null**，也不写 exam_review 消息；没评的部分只计入 `pending_points`，不算丢分（`lost_by_kp` / `subjects[].lost` / 结论都不含）。

        `self_ratings` 接受的写法（交卷时附带的也一样）：
        - 整题：`{"math1-2017-18": "full"}`；计算题给整题值 = 每个小问都按这个值
        - 按小问对象：`{"math1-2017-19": {"2": "full"}}`。小问键可以是 `2` / `"2"` / `"(2)"` / `"（2）"` / `"第2问"` / `"sub2"` / `"ii"` / `"Ⅱ"` / `"②"` / `"二"`，都规范成题库里的小问号
        - 按小问数组：`{"math1-2017-19": [{"sub_number": 2, "self_rating": "full"}]}`（也认 `number`/`sub` 和 `rating`），或按顺序 `["full", null]`
        - 组合键：`{"math1-2017-19:2": "full"}`（也认 `#`、`.`、`/` 分隔和 `"math1-2017-19(2)"`）
        - 值为 `null` = 这一项先不评（跳过，不报错）
        - 值只能是 `full` / `approach_ok_calc_wrong` / `no_idea`
      parameters:
        - $ref: '#/components/parameters/ExamId'
        - $ref: '#/components/parameters/Device'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idempotency_key
                - self_ratings
              properties:
                idempotency_key:
                  type: string
                self_ratings:
                  $ref: '#/paths/~1exams~1{id}~1submit/post/requestBody/content/application~1json/schema/properties/self_ratings'
            example:
              idempotency_key: 0b6c1d2e-0000-4000-8000-000000000001
              self_ratings:
                math1-2017-18: approach_ok_calc_wrong
                math1-2017-19:
                  '1': full
                  '2': approach_ok_calc_wrong
      responses:
        '200':
          description: 自评后的模考（result 已重算）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Exam'
                  - type: object
                    properties:
                      duplicate:
                        type: boolean
              example: {"id": "2c8e4f10-7a3b-4c5d-9e6f-0a1b2c3d4e5f", "kind": "paper", "title": "2017 数学一", "exam": "math1", "year": 2017, "question_ids": ["math1-2017-01", "math1-2017-18"], "question_count": 23, "max_score": 150, "status": "submitted", "duration_seconds": 10800, "elapsed_seconds": 10260, "remaining_seconds": 540, "server_time": "2026-11-01T17:05:00Z", "started_at": "2026-11-01T14:00:00Z", "submitted_at": "2026-11-01T16:51:00Z", "started_date": "2026-11-01", "submitted_date": "2026-11-01", "timezone": "America/Los_Angeles", "result": {"coach": {"date": "2026-11-01", "kind": "exam_review", "headline": "2017 数学一模考 73/150，线代拖了后腿（得分率 16%，丢 28.5 分），丢分最多的是「化二次型为标准形」（5.5 分），先把它补上。", "message_id": "92c02866-026b-4e31-931b-d3f2cff9aa7b"}, "score": 73, "sections": [{"count": 8, "score": 4, "wrong": 7, "correct": 1, "pending": 0, "section": "选择题", "max_score": 32}, {"count": 6, "score": 4, "wrong": 5, "correct": 1, "pending": 0, "section": "填空题", "max_score": 24}, {"count": 9, "score": 65, "wrong": 5, "correct": 4, "pending": 0, "section": "解答题", "max_score": 94}], "subjects": [{"lost": 31.5, "name": "高数", "rate": 0.616, "score": 50.5, "subject": "calculus", "max_score": 82, "pending_points": 0, "question_count": 13}, {"lost": 28.5, "name": "线代", "rate": 0.162, "score": 5.5, "subject": "linear_algebra", "max_score": 34, "pending_points": 0, "question_count": 5}, {"lost": 17, "name": "概率", "rate": 0.5, "score": 17, "subject": "probability", "max_score": 34, "pending_points": 0, "question_count": 5}], "max_score": 150, "lost_by_kp": [{"lost": 5.5, "name": "化二次型为标准形", "kp_path": "线性代数/二次型/化二次型为标准形", "subject": "linear_algebra", "question_numbers": [21]}, {"lost": 5.5, "name": "实对称矩阵的正交对角化", "kp_path": "线性代数/特征值与特征向量/实对称矩阵的正交对角化", "subject": "linear_algebra", "question_numbers": [21]}, {"lost": 4, "name": "单调性与极值", "kp_path": "高等数学/一元函数微分学/单调性与极值", "subject": "calculus", "question_numbers": [2]}], "score_rate": 0.487, "conclusions": ["得分 73/150，用时 0 分钟。", "线代得分率最低