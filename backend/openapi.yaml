                undone_action_ids: [b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e, a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d]
                trigger: command
                tool: updateDailyPlan
                summary: 把 3 道极限错题排进了明天
                reason: 你说「这周把极限练透」，这 3 道错题到了复习时间，先重做再刷新题。
                target:
                  kind: plan_task
                  id: 8b9c0d1e-2f3a-4b5c-6d7e-8f9a0b1c2d3e
                before: null
                after:
                  title: 重做 3 道极限错题
                undoable: false
                undone_at: '2026-11-01T12:01:00Z'
                created_at: '2026-11-01T11:55:00Z'
        '409':
