  /questions/{id}/explain:
    post:
      tags:
        - questions
      summary: 讲解 / 划词追问（SSE）
      description: |
        不传 `selectedText` 时给完整讲解；传了就是划词追问（「为什么」）。事件：`meta` → 若干 `step`（整步推送）→ `citation` → `done`。
        讲解优先用库里预生成的版本（`npm run gen:explanations`）；没有、也没有官方/专家解析，且 AI 已接入时现场生成一次并入库（同一题同时只生成一次，`EXPLAIN_ON_DEMAND=0` 关闭），生成期间每 5 秒推一个 `progress` 事件 `{stage:"generating",text:"讲解生成中"}`（前端可忽略）；质检 / 核对没过的仍返回 `pending_review`「这题讲解待核对」。
        讲解来源看 `done.source`：
        - `expert`：行业专家分步参考讲解（`/workspace/tiku/explanations/*_expert.jsonl`，末尾一步「下次记住」，`source_label` =「行业专家参考解答（非官方解析）」；文件追加新题后下次请求自动生效）
        - `official`：题库官方解析 questions.solution（或已 confirmed 的证明题题库证明）；`source_label` 已核对为「官方解析」，否则「官方解析（未核对）」
        - 每个来源都带 `verified`（meta 和 done 都有）：讲解核对记录 `reviews/explanations_<exam>_<year>.jsonl` 最新一条 pass / pass_minor 为 true
        - `ai`：已过双模型核对的 AI 讲解；有 Key 时追问由 AI 在官方解析/已核对讲解基础上回答
        - `pending`：没有任何讲解，不推 step，`done.status = pending`、`done.text = 讲解生成中`（有未通过核对的 AI 版本时 `status = pending_review`、「这题讲解待核对」）

        **没配置 AI Key 时不输出任何示例内容**：只有 expert / official / pending；追问也只返回这些原文。优先级 ai(已核对) > expert > official。
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplainRequest'
            example:
              selectedText: $f(x)$ 为奇函数
              step: 2
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 文本流；每条 data 是一个 JSON，结构见 x-sse-event-schema
              examples:
                expert:
                  summary: 行业专家参考解答（非官方解析）（math1-2024-19）
                  value: |
                    event: meta
                    data: {"type": "meta", "question_id": "math1-2024-19", "mock": false, "mode": "full", "source": "expert", "verified": true, "source_label": "行业专家参考解答（非官方解析）", "explanation_id": null}

                    event: step
                    data: {"type": "step", "n": 1, "text": "思路：构造 $g(x)=f(x)-f(0)(1-x)-f(1)x$，它满足 $g(0)=g(1)=0$，$g''=f''$，问题变成估计 $|g(x)|$。"}

                    event: step
                    data: {"type": "step", "n": 2, "text": "在点 $x$ 处把 $g(0)$、$g(1)$ 泰勒展开到二阶：$0=g(x)-g'(x)x+\\frac12g''(\\xi_1)x^2$，$0=g(x)+g'(x)(1-x)+\\frac12g''(\\xi_2)(1-x)^2$。"}

                    event: step
                    data: {"type": "step", "n": 3, "text": "第一式乘 $(1-x)$、第二式乘 $x$ 相加，消去 $g'(x)$：$g(x)=-\\frac{x(1-x)}{2}\\left[(1-x)g''(\\xi_1)+xg''(\\xi_2)\\right]$。"}

                    event: step
                    data: {"type": "step", "n": 4, "text": "由 $|g''|\\le1$，方括号绝对值 $\\le(1-x)+x=1$，得（1）$|g(x)|\\le\\frac{x(1-x)}{2}$。"}

                    event: step
                    data: {"type": "step", "n": 5, "text": "（2）对（1）积分：$\\int_0^1[f(0)(1-x)+f(1)x]\\mathrm dx=\\frac{f(0)+f(1)}{2}$，$\\int_0^1\\frac{x(1-x)}{2}\\mathrm dx=\\frac1{12}$，结论成立。"}

                    event: step
                    data: {"type": "step", "n": 6, "text": "**下次记住**：两端点信息加二阶导有界，就在中间点 $x$ 向两端泰勒展开，再加权消去一阶导。"}

                    event: citation
                    data: {"type": "citation", "year": 2024, "number": 19, "knowledge_points": ["高等数学/一元函数微分学/微分中值定理", "高等数学/一元函数微分学/泰勒公式"], "exam": "math1", "source_label": "行业专家参考解答（非官方解析）"}

                    event: done
                    data: {"type": "done", "verified": true, "status": "expert", "source": "expert", "source_label": "行业专家参考解答（非官方解析）", "review": {"verdict": "pass", "by": "用户", "at": "2026-11-01T05:05", "note": "已按反馈修正"}, "notice": null, "text": null, "explanation_id": null}
                pending:
                  summary: 暂无讲解（没有 step）
                  value: |
                    event: meta
                    data: {"type":"meta","question_id":"math1-2024-01","mock":false,"mode":"full","source":"pending","explanation_id":null}

                    event: citation
                    data: {"type":"citation","year":2024,"number":1,"exam":"math1","knowledge_points":["高等数学/一元函数积分学/变限积分"],"source_label":null}

                    event: done
                    data: {"type":"done","verified":false,"status":"pending","source":"pending","source_label":null,"notice":"讲解生成中","text":"讲解生成中","explanation_id":null}
              x-sse-event-schema:
                $ref: '#/components/schemas/ExplainEvent'
      operationId: postQuestionsByIdExplain
    get:
      tags:
