            - pending
            - pending_review
          description: verified=已核对的 AI 讲解；expert=行业专家参考解答（非官方解析）；official=官方解析；pending=暂无思路（hints 为空，text「思路生成中」）；pending_review=AI 讲解待核对
        source:
          $ref: '#/components/schemas/ExplainSource'
        verified:
          type: boolean
          description: 讲解是否已核对（规则同 explain 的 done.verified）
        review:
          $ref: '#/components/schemas/ExplanationReview'
        source_label:
          type: [string, 'null']
          example: 行业专家参考解答（非官方解析）
          description: 「行业专家参考解答（非官方解析）」/「官方解析」（已核对）/「官方解析（未核对）」/「AI 讲解（双模型核对）」
        notice:
          type: [string, 'null']
          description: pending 时为「思路生成中」，pending_review 时为「这题讲解待核对」
        text:
          type: [string, 'null']
          description: 同 notice
        explanation_id:
          type: [string, 'null']
