          schema:
            type: string
          example: math1
        - name: year
          in: query
          description: 最新模式：按年份过滤
          schema:
            type: integer
          example: 2024
        - name: question_ids
          in: query
          description: 最新模式：逗号分隔的题目 id
          schema:
            type: string
          example: math1-2024-01,math1-2024-02
