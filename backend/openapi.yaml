              type: boolean
              description: |
                讲解是否已核对。专家/官方讲解原文：看 reviews/explanations_<exam>_<year>.jsonl 里该题该类讲解最新（at 最晚）一条，pass / pass_minor = true，fail 或没有记录 = false；
                已过双模型核对的 AI 讲解 = true；AI 现场回答的追问、pending = false
            review:
