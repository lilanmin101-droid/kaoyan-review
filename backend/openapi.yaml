    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: string
        user:
          $ref: '#/components/schemas/User'
    Question:
      description: 对应 question_schema_draft.json v0.2。公式一律 LaTeX（$…$）。
      type: object
      properties:
        schema_version:
          type: string
          example: '0.2'
        id:
          type: string
          example: math1-2024-01
        exam:
          type: string
          example: math1
        year:
          type: integer
        number:
          type: integer
        section:
          type: string
          example: 选择题
        type:
          type: string
          enum:
            - single_choice
            - multi_choice
            - fill_blank
            - essay
            - cloze
            - reading
            - translation
            - writing
            - choice
            - match
        score:
          type: number
        score_estimated:
          type: boolean
          description: 有小问分值是按整题平均估算的（原卷没给小问分值）。前端在这些小问分值旁标「估」
        tables:
          type: array
          description: |
            题干里的结构化表格（英语一 2025 第 52 题、数学概率分布律等）。题干 / 小问题干里用 `{{table:N}}` 标出位置，N 是数组下标、从 0 开始（`{{table:0}}` = tables[0]）。
            原样返回（jsonb，对象键顺序不保证）；没有表格为 []。`{{table:N}}` 不是完形空位，不会出现在 passage.blanks 里
          items:
            $ref: '#/components/schemas/QuestionTable'
        errata:
          type: array
          description: |
            原卷误印说明（题面按原卷保留不改），原样返回；没有为 []。凡是返回题干的地方（/questions、/questions/{id}、错题本、模考报告错题）都带。
            前端可在题干下方提示「原卷如此：printed → correct」，note 是完整说明。目前英语一 2025 第 14、39 题有。导入时格式不对记 import_problems（errata_invalid），坏条目不入库
          items:
            type: object
            required: [printed, correct]
            properties:
              printed: { type: string, description: 原卷印的样子 }
              correct: { type: string, description: 应为 }
              note: { type: string, description: 说明 }
          example:
            - printed: Chrysanthi Gallon
              correct: Chrysanthi Gallou
              note: 原卷如此：完形第 3 段原卷印作 “Chrysanthi Gallon”，这位考古学家的名字应为 Chrysanthi Gallou；题面按原卷保留。
        passage_id:
          type:
            - string
            - 'null'
          description: 英语题所属文章（完形 / 阅读 A / 阅读 B / 翻译）；写作和数学题为 null
          example: english1-2024-P-text1
        passage:
          description: 只有 GET /questions/{id} 返回：整篇文章（含 blanks / underlines）；没有文章为 null
          oneOf:
            - $ref: '#/components/schemas/Passage'
            - type: 'null'
        explanation:
          $ref: '#/components/schemas/ExplanationInfo'
          description: 只有 GET /questions/{id} 返回：讲解出处 + 是否已核对
        score_by_whole:
          type: boolean
          description: |
            true = 整题计分：不拆小问分值（sub_questions[].score 为 null），自评只按整题给一个，得分按整题算。
            怎么定（优先级从高到低）：kp_tags 明写 score_by_whole=true → 整题；kp_tags 明写 sub_scores → 按小问（即使是证明题，如两问独立证明、分开给分）；
            kp_tags 明写 score_by_whole=false → 按小问；题目 JSON 自带 score_by_whole → 用它；都没写 → 自动识别，每一问都是证明才整题计分。
        sub_scores:
          type: [array, 'null']
          items:
            type: [number, 'null']
          description: 小问分值，按 sub_questions 顺序，等于 sub_questions[].score；整题计分（score_by_whole=true）或没有小问时为 null（不会是 [null]）
          example: [5, 3, 3]
        stem:
          type: string
        images:
          type: array
          items:
            type: string
        options:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              content:
                type: string
        answer:
          type: array
          items:
            type: string
          description: 只有 include_answer=true 时返回
        reference_answer:
          type:
            - string
            - 'null'
          description: 主观题参考答案（翻译 = 参考译文，写作 = 范文，其他解答题 = 题库答案；取自 answer，多段用空行拼接）。和 answer 一样只在 include_answer=true 时返回，否则 null；客观题恒为 null（看 answer / correct_answer）
        sub_questions:
          type: array
          items:
            type: object
            properties:
              number:
                type: integer
              stem:
                type: string
              score:
                type:
                  - number
                  - 'null'
                description: 小问分值；证明题（score_by_whole）为 null
              score_estimated:
                type: boolean
                description: true = 按整题分值平均估算（0.5 取整），前端标「估」
              answer:
                type: array
                items:
                  type: string
        solution:
          type:
            - string
            - 'null'
          description: 原卷/官方解析（Markdown，可能含图片）；导入时有就存，只有 include_answer=true 时返回
        knowledge_points:
          type: array
          items:
            type: string
        kp_confidence:
          type:
            - string
            - 'null'
          enum:
            - high
            - medium
            - low
            - none
            - null
        source:
          type: object
        review:
          type: object
          properties:
            status:
              type: string
              enum:
                - pending
                - suspect
                - confirmed
            notes:
              type: array
              items:
                type: string
            checked_by:
              type: array
              items:
                type: string
        import_problems:
          type: array
          items:
            type: object
        asset_base:
          type: string
          description: 图片相对路径的前缀，图片地址 = asset_base + 相对路径
          example: /api/v1/assets/
    HintResponse:
      type: object
      properties:
        question_id:
          type: string
        step:
          type: integer
        total_steps:
          type: integer
        has_more:
          type: boolean
        status:
          type: string
          enum:
            - verified
