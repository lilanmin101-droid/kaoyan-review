    DailyTip:
      type: [object, 'null']
      properties:
        kind:
          type: string
          enum:
            - tip
            - review
            - weekly
            - nudge
            - proposal
          description: tip 每日一句 / review 每晚 23:00 复盘 / weekly 周日 21:30 周报 / nudge 12:30 中午提醒（coach_frequency=more）/ proposal 待确认改动（coach_frequency=ask）
        date:
          type: string
          format: date
        text:
          type: string
        source:
          type: string
          description: ai（DeepSeek 生成）/ mock（没 Key 时按作答数据的规则文案）/ agent
        status:
          type: [string, 'null']
          enum: [pending, confirmed, dismissed, expired, null]
          description: |
            只有 kind=proposal 有：待确认 pending → 确认后 confirmed / 忽略后 dismissed（GET /agent/messages、/plans/today tips.proposal、confirm / dismiss 响应的 message 里都有）；其他消息为 null。
            **expired（读时算）**：还没确认、但目标日（target_date）早于读者此刻的学习日（X-Debug-Now 也算）→ 过期。这时顶层 status 和 `proposal.status` 都是 expired，
            headline 以「已」开头，如「已过期，计划没动。原本想在11-05（周四）的计划里加「做 5 道基础题热身」。」，前端原样显示（标「已过期」，不显示确认按钮）；
            details「建议安排在10-29（周四），这天已经过去了，这些改动没有执行，也不能再确认。…」，不再说「等你确认后才执行」。确认 → 409 proposal_expired，什么都不改；忽略照常可以。
        target_date:
          type: [string, 'null']
          format: date
          description: 只有 kind=proposal 有：建议改动的目标日（各条里最晚的 input.date；没有日期的改动按生成那天的下一天）。早于今天的学习日 → status=expired
        updated_at:
          type: string
          format: date-time
